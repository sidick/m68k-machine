[package]
name = "machine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std machine core (address bus / memory map) for the m68k Machine project"
publish = false

[dependencies]
# Intentionally empty: machine-core is a dependency-free #![no_std] crate.
# The m68k crate (m68k-rs) is NOT a runtime dependency: as of 0.12.1 it has
# no no_std support (unconditional `use std::` in several modules, see
# docs/phase0-findings.md), so it can only be used hosted, in tests.

[dev-dependencies]
# The project's `no_std`-capable fork, pinned by `rev` in
# [workspace.dependencies] (see the root Cargo.toml) so this crate, the
# hosted runner, and board-qemu-virt all share one pin. Still only a
# dev-dependency here: the bus does not need a CPU, and machine-core stays
# dependency-free in its normal build. See docs/phase0-findings.md.
m68k = { workspace = true }

[lints.clippy]
all = "warn"
