[package]
name = "machine-hosted"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hosted std runner for the m68k Machine: boots a ROM image over machine-core through m68k-rs"
publish = false

[[bin]]
name = "machine-hosted"
path = "src/main.rs"

[dependencies]
machine-core = { path = "../machine-core" }

# The project's `no_std`-capable fork, pinned by `rev` in
# [workspace.dependencies] (root Cargo.toml) -- same rationale as before
# (docs/phase0-findings.md): this project tracks the crate's guest-visible
# behaviour closely enough that an unplanned bump could silently change CPU
# semantics under us, so the pin is a deliberate, reviewed step, now shared
# with machine-core's dev-dependency and board-qemu-virt's dependency.
m68k = { workspace = true }

# clap over hand-rolling: this binary has seven flags including a couple
# of optional paths and numeric limits with defaults, which is exactly the
# case clap's derive macro removes the most boilerplate (and bug surface —
# help text, `--flag=value` vs `--flag value`, missing-argument errors) for.
# It is a hosted-only crate (this binary is std, never no_std), so the
# dependency-weight argument that keeps machine-core dependency-free does
# not apply here.
clap = { version = "4", features = ["derive"] }

# `--screenshot` output format (crates/machine-hosted/src/screenshot.rs).
# Pure Rust (image-rs org, MIT/Apache-2.0), no C toolchain requirement, and
# encoder-only usage here pulls in nothing beyond zlib-family compression
# crates -- see screenshot.rs's module doc comment for why PNG over PPM
# (worth one small dependency for viewer/CI-artifact convenience) and this
# crate over `image` (which would pull in a dozen unused codecs). Hosted-
# only, like clap above: no bare-metal build depends on this crate.
png = "0.18.1"

# `pktvol.rs`'s host-side filesystem backend for the `pktport` card
# (docs/pktport-protocol.md §8): parses the RDB partition table and mounts
# one FFS/OFS volume from it. Both are `machine-hosted`-only (host file
# I/O, `alloc`), like every other dependency in this section -- neither
# board's bare-metal build depends on them, and `machine-core` stays
# dependency-free per its own module docs. Default features (`std`) are
# left on: both crates gate their std::io conveniences behind it and this
# crate is std-only regardless.
amiga-rdb = "0.4"
amiga-ffs = "0.3"

[dev-dependencies]
# **New dev-only dependency, flagged prominently per this crate's task
# constraints.** Used solely by `tests/blitter_differential.rs` (`#[ignore]`d,
# does not run under a plain `cargo test`) to parse Copperline's JSON-RPC
# control-protocol responses (`custom.dump`'s nested register map in
# particular). Hand-rolling a JSON parser for that nested shape would be
# more code and more bug surface than pulling in the ecosystem-standard
# parser for a test-only, non-shipping dependency; it does not touch
# `machine-hosted`'s binary, `machine-core`, or either bare-metal board
# build.
serde_json = "1"

[lints.clippy]
all = "warn"
