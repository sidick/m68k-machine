[package]
name = "board-qemu-virt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "aarch64 bare-metal board layer for QEMU's `virt` machine (Phase 0 smoke payload)"
publish = false

# Canonical build command (run from the workspace root; a crate-local
# .cargo/config.toml would NOT apply here since cargo reads config from the
# invocation directory, not the crate directory):
#
#   cargo build -p board-qemu-virt --target aarch64-unknown-none
#
# The linker script (link.ld) is wired in by build.rs, which copies it into
# OUT_DIR and emits `cargo:rustc-link-arg=-Tlink.ld` +
# `cargo:rustc-link-search`, so it resolves regardless of invocation
# directory. `panic = "abort"` for this target is supplied by the
# workspace-root `.cargo/config.toml`'s `[target.aarch64-unknown-none]`
# rustflags, scoped to that target only so it never affects hosted builds
# or `cargo test`.
#
# Run under QEMU: scripts/run-qemu-virt.sh

# `test`/`bench` are off because this is a `no_std` bare-metal binary with
# its own `#[panic_handler]`. A test harness links `std`, whose
# `panic_impl` then collides with ours (E0152), which is why
# `cargo test --workspace` used to fail on this crate. There is nothing
# here a host-target test harness could run in any case: the tests that
# matter for this board are the QEMU runs in scripts/ and CI.
[[bin]]
name = "board-qemu-virt"
path = "src/main.rs"
test = false
bench = false

[dependencies]
machine-core = { path = "../machine-core" }

# The no_std fork (see the root Cargo.toml's [workspace.dependencies] doc
# comment and docs/phase0-findings.md): this is the first board layer that
# can actually link a CpuCore, now that upstream's no-no_std blocker is
# worked around by the fork.
m68k = { workspace = true }

[lints.clippy]
all = "warn"
