[workspace]
resolver = "2"
members = ["crates/machine-core", "crates/machine-hosted", "crates/board-qemu-q35", "crates/board-qemu-virt"]

# Workspace layout note (Phase 0):
#
# `crates/machine-core` is the only workspace member today. It is a
# dependency-free `#![no_std]` library and builds for every target the
# project cares about (hosted, for its own test suite, and
# aarch64-unknown-none, for the bare-metal board layers that will depend on
# it).
#
# The board crates (`crates/board-qemu-virt` for aarch64 and
# `crates/board-qemu-q35` for x86-64, added by other workers) will NOT be
# ordinary workspace members with a shared `--target`: each board is a
# separate bare-metal binary crate built with its own `--target` (and, for
# the UEFI board, its own linker/runtime concerns) via `cargo build -p
# board-qemu-virt --target aarch64-unknown-none` /
# `cargo build -p board-qemu-q35 --target x86_64-unknown-uefi`. Per-crate
# targets differ, and a single `cargo build --workspace` cannot target both
# at once, so board crates should either:
#   - be added as workspace members but always built with an explicit
#     `--target` and `-p <crate>` (never via a bare `cargo build
#     --workspace`), or
#   - be excluded from `members` below and built as independent crates
#     (own `[workspace]` or path dependency on `machine-core`) if the
#     per-target linker/runtime setup makes shared-workspace builds
#     impractical.
# Whichever a given board crate needs, note it in that crate's own
# Cargo.toml when it lands.

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The project owner's personal `no_std`-capable fork (docs/phase0-findings.md;
# upstream `m68k` 0.12.1 has no no_std support and the owner is not
# upstreaming this fork for now). Pinned by `rev`, not `branch`: a branch
# moves under us, and this project already pins the published crate exactly
# for the same reason -- an unplanned change in CPU semantics landing under
# the test suite (or, now, under bare-metal execution) must be a deliberate,
# reviewed step, not something that happens because someone else pushed to
# `feat/no-std`. Defined once here so every consumer (machine-core's
# hosted-only dev-dependency, machine-hosted's runtime dependency, and
# board-qemu-virt's new runtime dependency) shares one pin instead of three
# copies that could drift.
#
# `default-features = false`: the fork's default features pull in std-only
# pieces (see the fork's Cargo.toml); this project only wants the core
# interpreter, which works no_std + libm.
m68k = { git = "https://github.com/sidick/m68k-rs", rev = "5d27b8c083e1e6db6c13596f96c36dcc5f347e7f", default-features = false }

# The project owner's own crate (like `m68k` above -- same author, same
# pin-by-rev posture, but a different cause). `amiga-rom` 0.3.0 on
# crates.io lacks doubled-image detection (`KickRom::check_doubled` /
# `RomInfo::doubled_ok`) -- a fact this project's real `kickstart-34.5.rom`
# fixture (Kickstart 1.3's doubled 512 KB layout: a 256 KB image mirrored
# twice to fill a 512 KB EEPROM footprint) directly exercises. That fix
# landed in `42ae522` ("Add KickRom::check_doubled and RomInfo::doubled_ok");
# this pin sits two commits further, at `9e123e0`. The first (`8ae26a4`,
# "Add machine identification") carries `KickRom::machine_hints()` (best-
# effort machine-identity signals from resident names) and a checksum-
# table `identify`/`KnownRom` lookup; the second (`9e123e0`) is a real
# correctness fix to `machine_hints` this project would otherwise print
# wrong output from: AROS ROMs ship `card.resource` generically, so the
# earlier heuristic reported PCMCIA support on the vendored AROS pair
# this project boots routinely -- fixed upstream by an `is_aros` signal
# (an `aros.library` resident) that forces `has_pcmcia` false, plus the
# AROS `target_platform` port token (`amiga-m68k`). None of these is
# released to crates.io yet -- the release is being held back for further
# work on the crate, unrelated to this project's needs -- so pinning by
# `rev`, not `branch`, is the only way to get either fix at all right now.
# Same reasoning as the `m68k` pin above (a branch moves under us, a rev
# doesn't, and an unplanned change landing under this project's test suite
# must be a deliberate, reviewed step), just arrived at from the opposite
# direction: there `crates.io` was deliberately avoided because no release
# exists yet; here a release exists but is stale, so the fix has to come
# from a specific commit past it instead.
amiga-rom = { git = "https://github.com/sidick/amiga-rom-rs", rev = "9e123e0572178999d24190dc1991ce255e384af6" }
