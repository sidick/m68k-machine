name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (new push to a PR, etc.).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hosted build/lint/test: machine-core's and machine-hosted's own
  # suites, plus clippy for the two bare-metal board crates (built with
  # their explicit --target, since they cannot be built for the host --
  # see Cargo.toml's workspace-layout note and rust-toolchain.toml).
  test:
    name: test (fmt, clippy, machine-core, machine-hosted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins channel=stable plus rustfmt/clippy and the
      # two bare-metal targets; `rustup show` is enough to make rustup sync
      # to it (installing components/targets) without hardcoding the
      # toolchain again here.
      - name: Sync toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -p machine-core
        run: cargo clippy -p machine-core --all-targets -- -D warnings

      - name: cargo clippy -p board-qemu-virt (aarch64-unknown-none)
        run: cargo clippy -p board-qemu-virt --target aarch64-unknown-none -- -D warnings

      - name: cargo clippy -p board-qemu-q35 (x86_64-unknown-uefi)
        run: cargo clippy -p board-qemu-q35 --target x86_64-unknown-uefi -- -D warnings

      # NOT `cargo test --workspace`: the board crates are bare-metal-only
      # (no_std, custom target, no host runner) and would fail to build
      # for the default host target. machine-core and machine-hosted are
      # the crates with a hosted test suite today.
      - name: cargo test -p machine-core
        run: cargo test -p machine-core

      - name: cargo clippy -p machine-hosted
        run: cargo clippy -p machine-hosted --all-targets -- -D warnings

      - name: cargo test -p machine-hosted
        run: cargo test -p machine-hosted

      # The Phase 3 unattended-boot gate (docs/ci.md) cannot RUN here:
      # it boots licensed Kickstart media, which only private/local
      # runners have. The step above already compiles it; this step
      # asserts it stays listed, so public CI still fails if the gate
      # test is renamed away or dropped. `scripts/phase3-gate.sh` is
      # what actually runs it, on a machine with the media.
      - name: Phase 3 unattended-boot gate test compiled and listed
        run: |
          cargo test -p machine-hosted --test real_rom -- --list \
            | grep -F "kickstart_3_2_2_a1200_boots_unattended_to_rtg_workbench_with_input_storage_network"

  # aarch64 harness: build board-qemu-virt, boot it under QEMU's `virt`
  # machine, and assert it runs its bus/CPU checks and then boots the
  # embedded AROS ROM pair on bare metal, narrating over the PL011 UART.
  qemu-virt:
    name: qemu-virt (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install qemu-system-aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Build board-qemu-virt
        run: cargo build -p board-qemu-virt --target aarch64-unknown-none

      # Poll for AROS's own boot narration rather than the payload's
      # Phase 0 marker: the guest booting is the later and stronger
      # signal, and waiting for it means the completed log can then be
      # asserted for everything at once. The payload parks after its
      # bounded run, so the poll is what ends QEMU.
      #
      # Poll for the LAST line we intend to assert. The poll kills QEMU
      # the moment it matches, so waiting on an earlier line races the
      # rest of the output -- polling `callroms done` and then asserting
      # the chip-memory list passed on virt and failed on q35 for exactly
      # that reason.
      - name: Run under QEMU and wait for the AROS boot
        run: |
          ./scripts/run-qemu-virt.sh > virt-serial.log 2>&1 &
          qemu_pid=$!
          ./scripts/ci-grep-serial.sh \
            "'chip memory'" \
            virt-serial.log \
            180 \
            "$qemu_pid"

      # Assert the whole chain on the finished log, so a regression in
      # the Phase 0 bus/CPU checks cannot hide behind a successful boot.
      - name: Check the bare-metal boot markers
        run: |
          ./scripts/check-serial-markers.sh virt-serial.log \
            "PHASE0 BOARD-QEMU-VIRT: ALL CHECKS PASSED" \
            "PHASE1 BOARD-QEMU-VIRT: overlay cleared" \
            "GUEST | callroms done" \
            "'chip memory'"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-virt-serial-log
          path: virt-serial.log
          if-no-files-found: ignore

  # x86-64 harness: build board-qemu-q35 (UEFI), boot it under QEMU's
  # `q35` machine with OVMF firmware, and assert the same bus/CPU checks
  # and bare-metal AROS boot as the aarch64 harness above. run-qemu-q35.sh does the cargo build itself (it
  # needs to assemble an ESP directory from the built .efi), so this job
  # does not build it separately first.
  qemu-q35:
    name: qemu-q35 (x86-64 UEFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install qemu-system-x86 and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      # run-qemu-q35.sh rebuilds this itself, but doing it here first keeps
      # the compile out of the marker-poll window below (which would
      # otherwise have to absorb a cold-cache build of the uefi crate).
      - name: Build board-qemu-q35
        run: cargo build -p board-qemu-q35 --target x86_64-unknown-uefi

      # As for qemu-virt above, but with a longer budget: OVMF's own
      # firmware boot runs before the payload starts at all.
      - name: Run under QEMU and wait for the AROS boot
        run: |
          ./scripts/run-qemu-q35.sh > q35-serial.log 2>&1 &
          qemu_pid=$!
          ./scripts/ci-grep-serial.sh \
            "'chip memory'" \
            q35-serial.log \
            240 \
            "$qemu_pid"

      - name: Check the bare-metal boot markers
        run: |
          ./scripts/check-serial-markers.sh q35-serial.log \
            "PHASE0 BOARD-QEMU-Q35: ALL CHECKS PASSED" \
            "PHASE1 BOARD-QEMU-Q35: overlay cleared" \
            "GUEST | callroms done" \
            "'chip memory'"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-q35-serial-log
          path: q35-serial.log
          if-no-files-found: ignore

  # AROS 68k smoke boot: build machine-hosted, boot the vendored,
  # freely-redistributable AROS 68k ROM pair (assets/aros/ -- see
  # docs/ci.md and assets/aros/PROVENANCE.md for why this is vendored
  # in-repo rather than fetched, its licence, and how to refresh it
  # deliberately) bounded, and assert the guest reached exec and produced
  # serial output. This is the Phase 1 roadmap gate ("ROM pair loads,
  # exec starts, serial output reached") -- Kickstart is NOT part of this
  # job or this workflow, since it is not redistributable; see docs/ci.md
  # for that split.
  aros-smoke:
    name: aros-smoke (AROS 68k ROM pair)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build machine-hosted
        run: cargo build -p machine-hosted --release

      # --max-frames bounds the run so it always terminates (see
      # crates/machine-hosted/src/cli.rs); a real ROM at this phase is
      # expected to hit that bound rather than cleanly HALT (see run.rs's
      # `Outcome` docs), so exit code 1 ("LIMIT REACHED") is the normal,
      # passing outcome here -- only exit codes other than 0 (clean halt)
      # or 1 (bounded) indicate a real failure (wedge or setup error).
      # `set +e`/`set -e` bracket just the run so that expected non-zero
      # exit doesn't trip `set -e` before the status is inspected.
      - name: Run AROS smoke boot
        run: |
          set +e
          ./target/release/machine-hosted \
            --rom assets/aros/aros-amiga-m68k-rom.bin \
            --ext-rom assets/aros/aros-amiga-m68k-ext.bin \
            --max-frames 300 \
            --serial-log aros-serial.log
          status=$?
          set -e
          echo "machine-hosted exit code: $status"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "error: expected exit 0 (clean halt) or 1 (bounded run), got $status" >&2
            exit 1
          fi

      # Markers chosen to prove the full Phase 1 exit criterion --
      # "ROM pair loads, exec starts, serial output reached" -- without
      # being so specific to this AROS build that a routine nightly
      # version bump (a changed $VER string, a reordered ROMInfo line)
      # breaks CI spuriously:
      #   - "PHASE1 HOSTED: reached overlay-cleared" is this runner's own
      #     marker (crates/machine-hosted/src/run.rs), not AROS's, so it
      #     is stable regardless of AROS version: the CPU left the ROM
      #     overlay and is running from RAM-mapped exec.
      #   - "callroms done" is exec's own boot-time trace once it has
      #     finished walking and initialising ROM resident modules --
      #     present in every AROS nightly that gets this far, and a much
      #     more direct proxy for "exec started" than any address or
      #     version string.
      #   - "'chip memory'" is exec's MemHeader listing reaching serial,
      #     the concrete "serial output reached" evidence, without
      #     pinning to the exact byte ranges (which move if the machine's
      #     memory map ever changes) or ROM revision numbers (which
      #     change every nightly).
      - name: Check AROS serial output
        run: |
          ./scripts/check-serial-markers.sh aros-serial.log \
            "PHASE1 HOSTED: reached overlay-cleared" \
            "GUEST | callroms done" \
            "'chip memory'"

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aros-smoke-serial-log
          path: aros-serial.log
          if-no-files-found: ignore

  # m68k cross-toolchain smoke check: compiles a trivial AmigaOS C program
  # with the amiga-gcc container and verifies it produced a real Amiga
  # hunk executable. This is NOT the m68k-side stack (see m68k/hello/
  # comment / README "Related") -- it only proves the toolchain container
  # works, per the Phase 0 roadmap bullet "amiga-gcc toolchain container".
  amiga-gcc:
    name: amiga-gcc toolchain smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile m68k/hello/hello.c in the amiga-gcc container
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            ghcr.io/reinauer/container-amiga-gcc:latest \
            sh -c 'm68k-amigaos-gcc -noixemul -O2 -o hello.out m68k/hello/hello.c && file hello.out'

      - name: Verify Amiga hunk executable magic
        run: |
          magic="$(od -An -tx1 -N4 hello.out | tr -d ' ')"
          echo "magic bytes: $magic"
          if [ "$magic" != "000003f3" ]; then
            echo "error: expected Amiga hunk magic 000003f3, got $magic" >&2
            exit 1
          fi
          rm -f hello.out
